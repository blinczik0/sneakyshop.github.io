<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>SneakyVape</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo" onclick="goHome()">SneakyVape</div>
  <div class="cart-icon" onclick="toggleCart()">
    <svg viewBox="0 0 24 24">
      <path d="M7 4h-2l-3 9v2h4l1.68 4.84c.14.41.52.68.96.68h8.72c.44 0 .82-.27.96-.68l1.68-4.84h4v-2l-3-9h-2v-2h-12v2zm0 2h10l2.25 7h-14.5l2.25-7zm1 12c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2zm8 0c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
    </svg>
    <div class="cart-count" id="headerCartCount">0</div>
  </div>
</header>

<div id="overlay" onclick="toggleCart()"></div>

<div id="homePage" class="home">
  <h1>Выберите категорию</h1>
  <div class="catWrap">
    <div class="catBtn" onclick="showCategory('disposable')">Одноразки</div>
    <div class="catBtn" onclick="showCategory('pod')">Pod системы</div>
    <div class="catBtn" onclick="showAll()">Весь каталог</div>
  </div>
</div>

<div class="grid" id="productGrid"></div>

<div class="cartPanel" id="cartPanel">
  <div class="cart-header">
    <h2>Корзина</h2>
    <button class="closeCart" onclick="toggleCart()">✕</button>
  </div>
  <div class="cart-list" id="cartList"></div>
  <div class="cart-footer">
    <div class="total-label">Итого:</div>
    <div class="total-price" id="totalPrice">0 zł</div>
    <button class="checkout" onclick="checkout()">Оформить заказ</button>
  </div>
</div>

<footer class="footer">
  <div class="footer-container">
    <div class="footer-col">
      <h2 class="logo">SneakyVape</h2>
      <p>Оригинальные вейп-товары по лучшим ценам для Европы.</p>
    </div>
    <div class="footer-col">
      <h3>Каталог</h3>
      <ul>
        <li>Одноразки</li>
        <li>Pod системы</li>
      </ul>
    </div>
    <div class="footer-col">
      <h3>Контакты</h3>
      Telegram: <b>@SneakyVape</b>
    </div>
  </div>
  <div class="footer-bottom">© 2026 SneakyVape</div>
</footer>

<script src="script.js"></script>
</body>
</html>
