<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SneakyVape</title>

<style>
body{margin:0;font-family:Arial;background:#0f0f12;color:white}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
background:#0a0a0d;
border-bottom:1px solid #1e1e25;
}

.logo{
font-size:28px;
font-weight:bold;
cursor:pointer;
color:#00ffd5;
}

nav button{
margin-left:12px;
padding:10px 18px;
border:none;
border-radius:8px;
background:#1a1a22;
color:#fff;
cursor:pointer;
transition:.2s;
}
nav button:hover{background:#00ffd5;color:#000}

/* HOME */

.home{text-align:center;padding:80px 20px}
.home h1{font-size:42px;margin-bottom:50px;color:#00ffd5}

.catWrap{
display:flex;
gap:30px;
justify-content:center;
flex-wrap:wrap;
}

.catBtn{
background:linear-gradient(145deg,#15151c,#1f1f29);
padding:40px 60px;
font-size:24px;
border-radius:18px;
cursor:pointer;
transition:.3s;
box-shadow:0 0 25px rgba(0,255,213,.15);
}
.catBtn:hover{
transform:scale(1.08);
box-shadow:0 0 40px rgba(0,255,213,.4);
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:25px;
padding:30px;
}

.card{
background:#15151c;
border-radius:18px;
overflow:hidden;
box-shadow:0 0 20px rgba(0,255,213,.08);
transition:.25s;
}
.card:hover{
transform:translateY(-7px);
box-shadow:0 0 40px rgba(0,255,213,.25);
}

.card img{
width:100%;
height:200px;
object-fit:contain;
background:#111;
}

.info{padding:16px;text-align:center}

.price{
color:#00ffd5;
font-weight:bold;
margin:10px 0;
font-size:18px;
}

.add{
background:#00ffd5;
color:black;
border:none;
padding:12px;
width:100%;
font-weight:bold;
border-radius:8px;
cursor:pointer;
}
.add:hover{background:#00c2a5}

/* CART */

.cartBtn{
position:fixed;
right:25px;
bottom:25px;
background:#00ffd5;
color:black;
padding:16px 22px;
border-radius:14px;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 20px rgba(0,255,213,.4);
}

.cartPanel{
position:fixed;
top:0;
right:-420px;
width:420px;
height:100%;
background:#111;
padding:25px;
transition:.35s;
overflow:auto;
}
.cartPanel.active{right:0}

.checkout{
background:#00ffd5;
color:black;
border:none;
padding:15px;
width:100%;
font-size:18px;
margin-top:20px;
border-radius:10px;
cursor:pointer;
}
</style>
</head>

<body>

<header>
<div class="logo" onclick="goHome()">SneakyVape</div>

<nav>
<button onclick="showAll()">Каталог</button>
<button onclick="showCategory('disposable')">Одноразки</button>
<button onclick="showCategory('pod')">Поды</button>
</nav>
</header>



<div id="homePage" class="home">
<h1>Выберите категорию</h1>

<div class="catWrap">
<div class="catBtn" onclick="showCategory('disposable')">Одноразки</div>
<div class="catBtn" onclick="showCategory('pod')">Pod системы</div>
<div class="catBtn" onclick="showAll()">Весь каталог</div>
</div>
</div>



<div class="grid" id="productGrid"></div>


<div class="cartBtn" onclick="toggleCart()">🛒 <span id="cartCount">0</span></div>

<div class="cartPanel" id="cartPanel">
<h2>Корзина</h2>
<div id="cartItems"></div>
<button class="checkout" onclick="checkout()">Оформить заказ</button>
</div>



<script>

const telegram="https://t.me/your_telegram"
const grid=document.getElementById("productGrid")
const homePage=document.getElementById("homePage")

let cart=[]

/* БАЗОВЫЕ ТОВАРЫ */
const base=[
{name:"Geek Bar Pulse",c:"disposable",p:120,img:"https://cdn.shopify.com/s/files/1/0583/5810/4213/products/geekbar.jpg"},
{name:"Elf Bar BC5000",c:"disposable",p:95,img:"https://cdn.shopify.com/s/files/1/0583/5810/4213/products/elfbar.jpg"},
{name:"Lost Mary OS5000",c:"disposable",p:99,img:"https://cdn.shopify.com/s/files/1/0583/5810/4213/products/lostmary.jpg"},
{name:"Raz TN9000",c:"disposable",p:115,img:"https://cdn.shopify.com/s/files/1/0583/5810/4213/products/raz.jpg"},
{name:"Hyde IQ",c:"disposable",p:110,img:"https://cdn.shopify.com/s/files/1/0583/5810/4213/products/hyde.jpg"},

{name:"Vaporesso XROS 3",c:"pod",p:160,img:"https://cdn.shopify.com/s/files/1/0583/5810/4213/products/xros.jpg"},{name:"Uwell Caliburn G3",c:"pod",p:170,img:"https://cdn.shopify.com/s/files/1/0583/5810/4213/products/g3.jpg"},
{name:"Voopoo Argus P1",c:"pod",p:180,img:"https://cdn.shopify.com/s/files/1/0583/5810/4213/products/argus.jpg"},
{name:"OXVA Xlim Pro",c:"pod",p:175,img:"https://cdn.shopify.com/s/files/1/0583/5810/4213/products/xlim.jpg"},
{name:"SMOK Novo 5",c:"pod",p:150,img:"https://cdn.shopify.com/s/files/1/0583/5810/4213/products/novo.jpg"}
]

/* 80 товаров */
const products=[]
while(products.length<80){
let b=base[products.length%base.length]
products.push({...b,name:b.name+" "+(products.length+1)})
}


/* render */

function render(list){
grid.innerHTML=""
list.forEach(p=>{
grid.innerHTML+=`
<div class="card">
<img src="${p.img}">
<div class="info">
<div>${p.name}</div>
<div class="price">${p.p} zł</div>
<button class="add" onclick='addToCart(${JSON.stringify(p)})'>В корзину</button>
</div>
</div>`
})
}


/* navigation */

function showCategory(cat){
homePage.style.display="none"
render(products.filter(p=>p.c===cat))
}

function showAll(){
homePage.style.display="none"
render(products)
}

function goHome(){
homePage.style.display="block"
grid.innerHTML=""
}


/* cart */

function addToCart(p){
cart.push(p)
document.getElementById("cartCount").innerText=cart.length
drawCart()
}

function drawCart(){
const box=document.getElementById("cartItems")
box.innerHTML=""
cart.forEach(p=>{
box.innerHTML+=`<p>${p.name} — ${p.p} zł</p>`
})
}

function toggleCart(){
document.getElementById("cartPanel").classList.toggle("active")
}

function checkout(){
if(cart.length===0) return alert("Корзина пуста")
window.open(telegram)
}

</script>

</body>
</html>
