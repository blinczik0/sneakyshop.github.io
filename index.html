<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SneakyVape</title>
<style>
/* фон */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url('background.png') no-repeat center center fixed;
  background-size: cover;
  color: #fff;
  overflow-x: hidden;
}

/* header */
header{
  display:flex;
  justify-content: space-between;
  align-items:center;
  padding:18px 40px;
  background: rgba(10,10,13,0.9);
  border-bottom:1px solid #222;
  position: sticky;
  top: 0;
  z-index: 10;
}
.logo {
  font-size: 32px;
  font-weight: bold;
  cursor: pointer;
  background: linear-gradient(90deg,#ff00cc,#00ffd5);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* home */
.home{text-align:center;padding:80px 20px}
.home h1{
  font-size:42px;color:#00ffd5;margin-bottom:30px
}
.catWrap{
  display:flex;
  gap:20px;
  justify-content:center;
  flex-wrap:wrap;
}
.catBtn{
  padding:20px 40px;
  font-size:22px;
  border-radius:15px;
  background: rgba(30,30,40,0.8);
  cursor:pointer;
  transition:.3s;
  box-shadow:0 0 20px rgba(0,255,213,0.2);
}
.catBtn:hover {
  transform: scale(1.05);
  box-shadow:0 0 35px rgba(0,255,213,0.4);
}

/* grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:25px;
  padding:30px;
}
.card{
  background: rgba(25,25,35,0.9);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 0 15px rgba(0,255,213,0.15);
  transition: .3s;
}
.card:hover{
  transform:translateY(-8px);
  box-shadow:0 0 40px rgba(0,255,213,0.25);
}
.card img{
  width:100%;
  height:200px;
  object-fit:cover;
  transition:.5s;
}
.card img:hover{transform:scale(1.1);}
.info{padding:14px;text-align:center}
.price{
  color:#00ffd5;font-weight:bold;font-size:18px;margin:8px 0;
}
.add{
  background: linear-gradient(90deg,#ff00cc,#00ffd5);
  border:none;color:#000;
  padding:12px;
  width:100%;
  font-weight:bold;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
  transition:.3s;
}
.add:hover{
  background: linear-gradient(90deg,#00c2a5,#ff0099);
  color:#fff;
}

/* красивая корзина */
.cartBtn{
  position:fixed;
  right:25px;
  bottom:25px;
  background: linear-gradient(90deg,#ff00cc,#00ffd5);
  color:black;
  padding:18px 26px;
  border-radius:50px;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 30px rgba(255,0,204,0.55);
  transition:.3s;
}
.cartBtn:hover{
  transform: scale(1.12);
  box-shadow:0 0 45px rgba(255,0,204,0.6);
}

/* панель корзины */
.cartPanel{
  position:fixed;
  top:0;
  right:-500px;
  width:500px;
  height:100%;
  background: rgba(15,15,25,0.98);
  padding:25px;
  transition:right .4s ease;
  overflow:auto;
  box-shadow:-5px 0 30px rgba(0,0,0,0.5);
}
.cartPanel.active{
  right:0;
}
.cartHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}
.cartHeader h2{
  font-size:26px;
  color:#00ffd5;
}
.closeCart{
  background:#ff0044;
  border:none;color:#fff;
  font-size:20px;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
}

/* элементы в корзине */
.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
  background:rgba(255,255,255,0.07);
  padding:12px 14px;
  border-radius:12px;
  box-shadow:0 0 10px rgba(0,255,213,0.12);
}
.cart-item span{
  font-size:16px;
  font-weight:500;
}
.remove-btn{
  background:#ff0044;
  border:none;color:#fff;
  font-size:18px;
  width:30px;height:30px;
  border-radius:50%;
  cursor:pointer;
  transition:.3s;
}
.remove-btn:hover{
  transform:scale(1.3);
}

/* кнопка оформить */
.checkout{
  background: linear-gradient(90deg,#ff00cc,#00ffd5);
  border:none;color:#000;
  padding:15px;
  width:100%;
  margin-top:20px;
  border-radius:10px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
}
.checkout:hover{
  background: linear-gradient(90deg,#00c2a5,#ff0099);
  color:#fff;
}

/* отступ перед футером */
.spacer {height:180px;}

/* footer */
.footer{
  background: rgba(10,0,30,0.9);
  color:#fff;
  padding:50px 20px 20px;
  margin-top:60px;
}
.footer-container{
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
  gap:30px;
}
.footer-col h3{
  margin-bottom:10px;
  border-left:4px solid #00ffd0;
  padding-left:8px;
}
.footer-col ul{list-style:none;padding:0;}
.footer-col ul li{margin:8px 0;}
.footer-col ul li a{
  color:#ccc;text-decoration:none;transition:.3s;
}
.footer-col ul li a:hover{color:#00ffd0;}
.footer-bottom{margin-top:45px;border-top:1px solid rgba(255,255,255,0.1);padding-top:15px;text-align:center;font-size:14px;}
</style>
</head>
<body>

<header>
  <div class="logo" onclick="goHome()">SneakyVape</div>
  <!-- навигация убрана -->
</header>

<div id="homePage" class="home">
  <h1>Выберите категорию</h1>
  <div class="catWrap">
    <div class="catBtn" onclick="showCategory('disposable')">Одноразки</div>
    <div class="catBtn" onclick="showCategory('pod')">Pod системы</div>
    <div class="catBtn" onclick="showAll()">Весь каталог</div>
  </div>
</div>

<div class="grid" id="productGrid"></div>

<div class="spacer"></div>

<!-- КРАСИВАЯ КОРЗИНА -->
<div class="cartBtn" onclick="toggleCart()">🛒 <span id="cartCount">0</span></div>

<div class="cartPanel" id="cartPanel">
  <div class="cartHeader">
    <h2>Корзина</h2>
    <button class="closeCart" onclick="toggleCart()">✕</button>
  </div>
  <div id="cartItems"></div>
  <button class="checkout" onclick="checkout()">Оформить заказ</button>
</div>

<script>
const telegram="https://t.me/your_telegram"
const grid=document.getElementById("productGrid")
const homePage=document.getElementById("homePage")
let cart=[]

const base=[
{ name:"Geek Bar Pulse",c:"disposable",p:120,img:"https://cdn.shopify.com/s/files/1/0583/5810/4213/products/geekbar.jpg"},
{ name:"Elf Bar BC5000",c:"disposable",p:95,img:"https://cdn.shopify.com/s/files/1/0583/5810/4213/products/elfbar.jpg"},
{ name:"Lost Mary OS5000",c:"disposable",p:99,img:"https://cdn.shopify.com/s/files/1/0583/5810/4213/products/lostmary.jpg"},
{ name:"Raz TN9000",c:"disposable",p:115,img:"https://cdn.shopify.com/s/files/1/0583/5810/4213/products/raz.jpg"},
{ name:"Hyde IQ",c:"disposable",p:110,img:"https://cdn.shopify.com/s/files/1/0583/5810/4213/products/hyde.jpg"},
{ name:"Vaporesso XROS 3",c:"pod",p:160,img:"https://cdn.shopify.com/s/files/1/0583/5810/4213/products/xros.jpg"},
{ name:"Uwell Caliburn G3",c:"pod",p:170,img:"https://cdn.shopify.com/s/files/1/0583/5810/4213/products/g3.jpg"},
{ name:"Voopoo Argus P1",c:"pod",p:180,img:"https://cdn.shopify.com/s/files/1/0583/5810/4213/products/argus.jpg"},
{ name:"OXVA Xlim Pro",c:"pod",p:175,img:"https://cdn.shopify.com/s/files/1/0583/5810/4213/products/xlim.jpg"},
{ name:"SMOK Novo 5",c:"pod",p:150,img:"https://cdn.shopify.com/s/files/1/0583/5810/4213/products/novo.jpg"}
]
const products=[]
while(products.length<80){
  let b=base[products.length%base.length]
  products.push({...b,name:b.name+" "+(products.length+1)})
}

function render(list){
  grid.innerHTML=""
  list.forEach(p=>{
    grid.innerHTML+=`
    <div class="card">
      <img src="${p.img}">
      <div class="info">
        <div>${p.name}</div>
        <div class="price">${p.p} zł</div>
        <button class="add" onclick='addToCart(${JSON.stringify(p)})'>В корзину</button>
      </div>
    </div>`
  })
}

function showCategory(cat){
  homePage.style.display="none"
  render(products.filter(p=>p.c===cat))
}
function showAll(){
  homePage.style.display="none"
  render(products)
}
function goHome(){
  homePage.style.display="block"
  grid.innerHTML=""
}

function addToCart(p){
  cart.push(p)
  document.getElementById("cartCount").innerText=cart.length
  drawCart()
}
function removeFromCart(i){
  cart.splice(i,1)
  document.getElementById("cartCount").innerText=cart.length
  drawCart()
}
function drawCart(){
  const box=document.getElementById("cartItems")
  box.innerHTML=""
  cart.forEach((p,i)=>{
    box.innerHTML+=`
    <div class="cart-item">
      <span>${p.name} — ${p.p} zł</span>
      <button class="remove-btn" onclick="removeFromCart(${i})">×</button>
    </div>`
  })
}
function toggleCart(){
  document.getElementById("cartPanel").classList.toggle("active")
}
function checkout(){
  if(!cart.length) return alert("Корзина пуста")
  window.open(telegram)
}
</script>

<footer class="footer">
  <div class="footer-container">
    <div class="footer-col">
      <h2 class="logo">SneakyVape</h2>
      <p>Оригинальные вейп‑товары по лучшим ценам для Европы.</p>
    </div>
    <div class="footer-col">
      <h3>Каталог</h3>
      <ul>
        <li><a href="#pods">Поды</a></li>
        <li><a href="#disposables">Одноразки</a></li>
      </ul>
    </div>
    <div class="footer-col">
      <h3>Информация</h3>
      <ul>
        <li>Доставка</li>
        <li>Оплата</li>
        <li>FAQ</li>
      </ul>
    </div>
    <div class="footer-col">
      <h3>Контакты</h3>
      <p>Telegram: <b>@SneakyVape</b></p>
    </div>
  </div>
  <div class="footer-bottom">
    © 2026 SneakyVape
  </div>
</footer>

</body>
</html>
